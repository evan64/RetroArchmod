name: pix16 release

on:
  push:
    branches: [pix16-build]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: pix16-build-${{ github.run_number }}

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev \
            libudev-dev libasound2-dev libpulse-dev libfreetype6-dev \
            libxxf86vm-dev libgbm-dev zlib1g-dev libdrm-dev

      - name: Configure
        run: |
          ./configure --disable-ffmpeg --disable-qt --disable-sdl --disable-sdl2 \
            --disable-vulkan --disable-opengl1 --enable-pix16

      - name: Build
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        run: |
          tail -n 25 build.log 2>/dev/null | while IFS= read -r l; do
            printf '::error::%s\n' "$(printf '%s' "$l" | cut -c1-350)"
          done

      - name: Package AppImage
        run: |
          set -e
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          mkdir -p AppDir/usr/share/retroarch/assets/pix16
          cp retroarch AppDir/usr/bin/
          cp com.libretro.RetroArch.desktop AppDir/usr/share/applications/
          cp media/com.libretro.RetroArch.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          cp media/pix16/boot_logo.png AppDir/usr/share/retroarch/assets/pix16/

          wget -q -O linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          ./linuxdeploy --appimage-extract-and-run \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/com.libretro.RetroArch.desktop \
            --icon-file media/com.libretro.RetroArch.svg \
            -e AppDir/usr/bin/retroarch

          wget -q -O appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir RetroArch-pix16-x86_64.AppImage
          ls -l RetroArch-pix16-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: RetroArch-pix16-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows x64 zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            make
            zip

      - name: Configure and build
        shell: msys2 {0}
        run: |
          sed -i 's/\r$//' configure
          find qb -type f -name '*.sh' -exec sed -i 's/\r$//' {} +
          ./configure --enable-pix16 --disable-ffmpeg --disable-qt --disable-sdl --disable-sdl2 2>&1 | tee configure.log
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        shell: msys2 {0}
        run: |
          tail -n 25 build.log 2>/dev/null | while IFS= read -r l; do
            printf '::error::%s\n' "$(printf '%s' "$l" | cut -c1-350)"
          done
          tail -n 10 configure.log 2>/dev/null | while IFS= read -r l; do
            printf '::error::%s\n' "$(printf '%s' "$l" | cut -c1-350)"
          done

      - name: Package zip
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp retroarch.exe dist/
          cp /mingw64/bin/libwinpthread-1.dll dist/
          cd dist
          zip -r ../RetroArch-pix16-win64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: RetroArch-pix16-win64.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: pix16 build ${{ github.run_number }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            pix16, a low-resolution 16-bit console style menu driver for RetroArch.

            Built from `${{ github.sha }}`.

            Includes four launch effects (Battle Swirl, Mosaic, CRT Off, Zoom Flash),
            eight colour themes, the justified systems grid, the themed BIOS boot
            screen and the first-run 4:3 / widescreen prompt.

            **Linux**: `RetroArch-pix16-x86_64.AppImage` - make it executable and run it.
            **Windows**: `RetroArch-pix16-win64.zip` - unpack next to an existing 64-bit
            RetroArch install (it carries the newer `libwinpthread-1.dll`).

            Pick the menu with `Settings > Drivers > Menu > pix16`, or set
            `menu_driver = "pix16"` in `retroarch.cfg`, then restart.
          files: dist/*
